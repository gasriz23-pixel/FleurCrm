name: CI
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: npm install
      - run: npm run lint
      - run: npx prisma generate
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test -- --run
